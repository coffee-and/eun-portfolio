name: Run compact portfolio refactor

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/run-compact-portfolio-refactor.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: refactor/compact-portfolio-content
          fetch-depth: 0

      - name: Update source styles
        run: python scripts/compact_portfolio.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit verified styles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles/frame-form.css src/styles/final-polish.css
          git commit -m "포트폴리오 콘텐츠 밀도 정리"
          git push origin refactor/compact-portfolio-content
