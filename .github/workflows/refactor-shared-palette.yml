name: Refactor shared palette

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refactor-shared-palette.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Centralize palette declarations
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_first_root(path: str, replacement: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              start = text.find(":root {")
              if start < 0:
                  raise RuntimeError(f"No :root block found in {path}")

              depth = 0
              end = None
              for index in range(start, len(text)):
                  char = text[index]
                  if char == "{":
                      depth += 1
                  elif char == "}":
                      depth -= 1
                      if depth == 0:
                          end = index + 1
                          break

              if end is None:
                  raise RuntimeError(f"Unclosed :root block in {path}")

              while end < len(text) and text[end] == "\n":
                  end += 1

              file_path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")

          replace_first_root(
              "src/styles/global.css",
              ":root {\n"
              "  --radius-sm: 10px;\n"
              "  --radius-md: 16px;\n"
              "  --radius-lg: 24px;\n"
              "  --radius-pill: 999px;\n"
              "}\n\n",
          )

          replace_first_root("src/styles/editorial.css", "")

          replace_first_root(
              "src/styles/frame-form.css",
              ":root {\n"
              "  --shadow-sm: none;\n"
              "  --shadow-md: none;\n"
              "  --shadow-lg: none;\n"
              "  --radius-sm: 0;\n"
              "  --radius-md: 0;\n"
              "  --radius-lg: 0;\n"
              "}\n\n",
          )

          app_path = Path("src/App.tsx")
          app_text = app_path.read_text(encoding="utf-8")
          app_text = app_text.replace('import "./styles/shared-palette.css";\n', "")
          app_path.write_text(app_text, encoding="utf-8")

          main_path = Path("src/main.tsx")
          main_text = main_path.read_text(encoding="utf-8")
          if 'import "./styles/shared-palette.css";' not in main_text:
              main_text = main_text.replace(
                  'import { createRoot } from "react-dom/client";\n',
                  'import { createRoot } from "react-dom/client";\n'
                  'import "./styles/shared-palette.css";\n',
              )
          main_path.write_text(main_text, encoding="utf-8")

          palette_path = Path("src/styles/shared-palette.css")
          palette_text = palette_path.read_text(encoding="utf-8")
          palette_text = re.sub(r"\n  --shadow-sm: none;\n  --shadow-md: none;\n  --shadow-lg: none;\n", "\n", palette_text)
          palette_text = palette_text.replace("\n  --font-weight-accent: 500;", "")
          palette_path.write_text(palette_text, encoding="utf-8")

          type_path = Path("src/styles/typography-polish.css")
          type_text = type_path.read_text(encoding="utf-8")
          if "--font-weight-accent" not in type_text:
              type_text = type_text.replace(
                  '  --font-mono: "SUIT Variable", SUIT, "Pretendard", system-ui, sans-serif;\n',
                  '  --font-mono: "SUIT Variable", SUIT, "Pretendard", system-ui, sans-serif;\n'
                  '  --font-weight-accent: 500;\n',
              )
          type_path.write_text(type_text, encoding="utf-8")

          forbidden = re.compile(
              r"--(?:ink|navy|wine|red|burgundy|gold|blue|slate|silver|"
              r"text-primary|text-secondary|text-muted|brand-primary|brand-text|"
              r"border-light|border-strong|bg-primary|bg-card|bg-muted|bg-pill)"
              r"\s*:\s*(?:#|rgba?\()",
              re.IGNORECASE,
          )

          violations = []
          for css_path in Path("src/styles").glob("*.css"):
              if css_path.name == "shared-palette.css":
                  continue
              for line_number, line in enumerate(css_path.read_text(encoding="utf-8").splitlines(), 1):
                  if forbidden.search(line):
                      violations.append(f"{css_path}:{line_number}: {line.strip()}")

          if violations:
              raise RuntimeError("Duplicate palette declarations remain:\n" + "\n".join(violations))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit verified refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/main.tsx \
            src/App.tsx \
            src/styles/global.css \
            src/styles/editorial.css \
            src/styles/frame-form.css \
            src/styles/shared-palette.css \
            src/styles/typography-polish.css
          git commit -m "공용 팔레트 구조 정리"
          git push origin main
