name: Verify portfolio

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  style-cleanup:
    if: github.event_name == 'pull_request' && github.head_ref == 'refactor/accordion-and-dead-code-cleanup'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: refactor/accordion-and-dead-code-cleanup
          fetch-depth: 0
          show-progress: false

      - name: Clean legacy styles
        run: node scripts/cleanup-legacy-styles.mjs

      - name: Commit cleaned styles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles
          if git diff --cached --quiet; then
            echo "No legacy styles remain."
          else
            git commit -m "구형 전역 스타일 제거"
            git push origin refactor/accordion-and-dead-code-cleanup
          fi

  repository-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Audit public assets
        id: public-assets
        continue-on-error: true
        run: node scripts/audit-public-assets.mjs

      - name: Audit removed selectors
        id: legacy-selectors
        continue-on-error: true
        run: node scripts/audit-legacy-selectors.mjs

      - name: Upload audit report
        if: steps.public-assets.outcome == 'failure' || steps.legacy-selectors.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: repository-audit-report
          path: .audit
          include-hidden-files: true
          if-no-files-found: error

      - name: Check audit result
        run: |
          test ! -f .audit/public-assets.failed
          test ! -f .audit/legacy-selectors.failed

  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
