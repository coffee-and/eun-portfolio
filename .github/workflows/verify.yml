name: Verify portfolio

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  compact-refactor:
    if: github.event_name == 'pull_request' && github.event.action == 'reopened' && github.head_ref == 'refactor/compact-portfolio-content'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: refactor/compact-portfolio-content
          fetch-depth: 0

      - name: Update source styles
        run: python scripts/run_compact_portfolio.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit verified styles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles/frame-form.css src/styles/final-polish.css
          git commit -m "포트폴리오 콘텐츠 밀도 정리"
          git push origin refactor/compact-portfolio-content
