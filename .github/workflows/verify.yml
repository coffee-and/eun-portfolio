name: Verify portfolio

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Audit public assets
        run: node scripts/audit-public-assets.mjs

      - name: Audit removed selectors
        run: node scripts/audit-legacy-selectors.mjs

  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
